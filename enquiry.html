<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="WARM_OVEN_STUDIO-removebg-preview.png" alt="Logo" width="150" height="150">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="products.html">Our Pastries</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact Us</a>
    </header>

    <main>
        <h1>Product Enquiry Form</h1>
        <p>Have a question about our menu, custom celebration cakes, or bulk orders? Fill out the form below and our team will get back to you within 24 hours.</p>

        <form action="#" method="post">
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="category">Enquiry Type:</label><br>
            <select id="category" name="category">
                <option value="custom-cake">Custom Cake Request</option>
                <option value="wholesale">Wholesale Order</option>
                <option value="general">General Product Question</option>
            </select><br><br>

            <label for="message">Details / Special Requests:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" required></textarea><br><br>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p1>&copy; 2026 Warm Oven Studio. All rights reserved.</p>
    </footer>

</body>
</html>
